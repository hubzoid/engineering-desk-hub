# Engineering Desk's settings. Yours to edit: updates to this repo never change this
# file (new options get a default in code and a line in CHANGELOG.md). The next
# run reads changes, no restart needed. A wrong key or value fails the next run
# with a message that names it. SETUP.md explains every choice.

engineering_desk:
  version: 2                # nothing runs on its own until a repo below turns it on
  # sample: the fictional kestrel-oak/storefront repo, never touches GitHub.
  # github: the repos below, read with the GITHUB_TOKEN secret (or a GitHub App).
  source: github
  # poll: every 2 minutes, no public URL needed. webhook: instant, needs a
  # GitHub webhook (SETUP.md, "Instant reviews").
  trigger: poll
  # false: Engineering Desk ignores /hubzoid in pull request comments. Per repo too.
  commands: true
  # Context added to every review.
  context: ""

  # The repos Engineering Desk knows. Chat answers about any of them, and Engineering Desk makes
  # each one a short profile (what it is, where sign-in lives). Each switch is
  # off unless set to true:
  #   reviews   pull request reviews, follow-ups and /hubzoid on pull requests
  #   security  daily dependency watch and weekly deep audit, with alerts
  #   reports   weekly digest and the monthly code and delivery reports
  repos: []
  # repos:
  #   - name: your-org/api
  #     reviews: true
  #     security: true
  #     reports: true
  #     context: "Customer emails and addresses live in the orders table."
  #   - name: your-org/web
  #     reviews: true
  #   - name: your-org/docs      # chat and a profile only

  # Who gets email. Leave a list out and results stay on their pages in the web app.
  email:
    security: null          # e.g. platform-security, a list under email_lists below
    reports: null           # e.g. eng-leads

  review:
    severity_floor: high        # high by default. medium and low are optional, with high confidence
    backlog: all                # all open PRs, in batches. Alternatives: latest or new
    first_run_limit: 6          # first sweep: with backlog: latest, select the newest N eligible PRs
    max_prs_per_run: 5          # reviews per sweep, to bound cost
    max_findings: 8             # inline comments per review
    max_diff_chars: 200000      # diff read per review, code first. A bigger change is reviewed in part and says so
    max_age_days: 0             # 0: no age cutoff. Otherwise older PRs wait for a push or a manual review
    verify: true                # a second pass tries to refute each finding against the whole file
    post_to_github: false       # true: post summary, inline comments and status (SETUP.md, "Publish reviews")
    wait_for_profile_minutes: 10  # a new repo's first reviews wait up to this long for its profile
    summary_on_clean: true      # a clean PR still gets the summary comment (what it does, suggestions)
    auto_pause_after: 0         # 0: keep reviewing pushes. A positive limit pauses busy PRs
    skip_label: engineering-desk-skip
    status_check: report        # off · report: pending, then success with counts · gate: failure while blocking findings are open

  security:
    severity_floor: high        # plus anything CISA lists as exploited now, and advisories with no rating
    # The security watch and deep audit always skip test, sample, fixture, example,
    # vendored and build folders, and minified or generated code. Globs to skip too:
    # `docs/` or `docs/**` is a folder. Other patterns are fnmatch (* crosses /).
    exclude_paths: []

  audit:
    budget_minutes: 20          # per run. The audit resumes the next day
    safety_days: 8              # audit anyway if the audit day was missed
    verify: true                # a second pass tries to refute each finding before anyone is alerted

  digest:
    days: 7
    poem: false

  reports:
    people: true               # true: managers with the grant and engineering_desk_groups may run people_report

  limits:
    model_calls_per_day: 400
    replies_per_person_per_hour: 10

  # Isolated Ruff/Gitleaks presets scan changed files, including dotfiles, as data.
  # Custom SARIF commands require allow_project_code: true on that analyzer.
  # They can execute PR configuration and are NOT sandboxed. Missing or unapproved
  # tools are skipped with a note. Results are evidence for the reviewer.
  analyzers:
    - name: ruff
      run: [ruff, check, --output-format, sarif, --exit-zero, --no-cache, --isolated, --select, "F,B,S", .]
    - name: gitleaks
      run: [gitleaks, dir, ., --report-format, sarif, --report-path, "-", --no-banner, --exit-code, "0", --redact]

# Email lists, edited by hub admins. One message per recipient. Each must have
# an account here or be at an allowed company domain. Messages are a short
# summary and a link.
email_lists: {}
# email_lists:
#   platform-security: [you@your-company.com]
#   eng-leads: [lead@your-company.com]

# GitHub's webhook endpoint for trigger: webhook. Always declared, because the
# github_events workflow needs it to load. It accepts nothing until the hub's
# .env has WEBHOOK_SECRET_GITHUB (SETUP.md, "Instant reviews"). Until then
# hubzoid doctor lists that secret as missing, which is expected.
webhooks:
  github: {verify: github}
