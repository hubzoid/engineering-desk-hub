# Labels for Engineering Desk's restricted capabilities in Settings, Agents, Access.
engineering_desk:
  label: Engineering Desk tools
  description: Ask about pull requests, findings, code, history, security and repo profiles; draft rules.
  sensitive: true
engineering_desk_manager:
  label: Engineering Desk people data
  description: Counts per person for the digest groups set in this person's engineering_desk_groups attribute.
  sensitive: true
engineering_desk_admin:
  label: Engineering Desk rule approval
  description: Approve or reject drafted team rules. Approval writes the rule file.
  sensitive: true
