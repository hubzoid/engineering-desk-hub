name: engineering-desk
on:
  push:
  pull_request:
  schedule:
    - cron: "41 3 * * *"        # nightly against the latest Hubzoid 2.x release
permissions:
  contents: read
jobs:
  tests:
    name: tests (hubzoid ${{ matrix.hubzoid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hubzoid: ["==2.0.3", ">=2.0.3,<3"]   # the minimum this repo promises, and the latest 2.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hubzoid and the test runner
        run: python -m pip install "hubzoid${{ matrix.hubzoid }}" pytest
      - name: Install the real secret scanner (the scanner regressions use it)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: "Tests (sample repo, scripted model, Hubzoid's run_local; real-model tests excluded)"
        run: python -m pytest --junitxml=output/tests.xml
      - name: Evals parse
        run: hubzoid eval list .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ strategy.job-index }}
          path: output/*.xml
